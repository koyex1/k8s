name: Deploy cart

on:
  workflow_run:
    workflows: ["ci cart"]
    types:
      - completed #others are requested, waiting, in_progress, completed. others are 
    
 
jobs:
  deploy:
    defaults:
      run:
        working-directory: ${{ inputs.resource-path }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, test, staging, production]
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    #if: ${{ github.event.inputs.app_environment == 'dev' }} || ${{ github.event.inputs.app_environment == 'all-environments' }}
    steps:
      - uses: .github/workflows/actions/composite_deploy
        with:
          app_environment: "${{ matrix.environment }}"
          chart_path: "./cart-chart"
          service: "cart"
          image_repository: "koyex1/cart"
          image_tag: "${{ github.event.workflow_run.head_sha }}" 