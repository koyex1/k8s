apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: register-http-route
spec:
  parentRefs:
  - name: gateway
  hostnames:
  - "foo.com" #chart - loadbalancer url.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /register
    backendRefs:
    - name: register-service1
      port: 8080
      weight: 100
    - name: register-service2
      port: 8080
      weight: 0